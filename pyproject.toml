[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "expedition33-research"
version = "0.1.0"
description = "Independent build-specific Expedition 33 Python modding SDK"
requires-python = ">=3.13"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"expedition33.cinematics" = ["title_profiles.json", "media_profiles.json", "aliciabirth_audio.json", "original_action_maps.json"]
